# =============================================================
# SonarQube Project Properties - MERCAPLENO
# Análisis multi-módulo: Backend NestJS + Frontend React/Vite
# =============================================================

sonar.projectKey=mercapleno
sonar.projectName=MERCAPLENO - Sistema de Gestión
sonar.projectVersion=2.0.0

# Conexión a SonarQube
sonar.host.url=http://localhost:9000
sonar.token=sqa_4fc13df220cae467654b936838820857d2d6cb12

# Encoding
sonar.sourceEncoding=UTF-8

# Módulos del proyecto
sonar.modules=backend,frontend

# Exclusiones globales (node_modules de ambos módulos)
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.git/**

# Límite memoria análisis JS/TS (evita que se cuelgue)
sonar.javascript.node.maxspace=2048

# =============================================================
# MÓDULO: BACKEND (NestJS + TypeScript)
# =============================================================
backend.sonar.projectName=MERCAPLENO Backend (NestJS)
backend.sonar.projectBaseDir=mercapleno-backend

# Código fuente
backend.sonar.sources=src

# Pruebas
backend.sonar.tests=tester

# Cobertura de código generada por Jest
backend.sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Usar tsconfig.sonar.json (excluye node_modules explícitamente - evita cuelgue)
backend.sonar.typescript.tsconfigPath=tsconfig.sonar.json

# Exclusiones de fuentes
backend.sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  coverage/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.js,\
  prisma/**,\
  scripts/**,\
  reports/**,\
  **/*.d.ts

# Exclusiones de cobertura
backend.sonar.coverage.exclusions=\
  node_modules/**,\
  dist/**,\
  src/main.ts,\
  src/**/*.module.ts,\
  src/**/*.dto.ts,\
  src/types/**

# =============================================================
# MÓDULO: FRONTEND (React + Vite)
# =============================================================
frontend.sonar.projectName=MERCAPLENO Frontend (React/Vite)
frontend.sonar.projectBaseDir=Propio

# Código fuente
frontend.sonar.sources=app,src

# Exclusiones de fuentes
frontend.sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  public/**,\
  **/*.test.js,\
  **/*.spec.js,\
  vite.config.js,\
  eslint.config.js
